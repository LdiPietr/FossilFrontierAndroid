name: Build Fossil Frontier APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    name: Compile Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed Android package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FossilFrontier-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FossilFrontierAndroid.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" FossilFrontierAndroid.apk --target "$GITHUB_SHA" --title "Fossil Frontier Android - build $GITHUB_RUN_NUMBER" --notes "APK di test, firmato con la chiave debug. Versione offline originale; non destinata alla pubblicazione su Play Store." --prerelease
